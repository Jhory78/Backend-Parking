spring:
  application:
    name: parking
  config:
    # Local runs: load the same git-ignored .env used by docker compose (see .env.example)
    import: optional:file:./.env[.properties]
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5433/parking_db}
    username: ${SPRING_DATASOURCE_USERNAME:parking_user}
    # No default: credentials must come from the environment or the git-ignored .env
    password: ${SPRING_DATASOURCE_PASSWORD:${POSTGRES_PASSWORD}}
  jpa:
    # The schema is owned by Flyway (src/main/resources/db/migration); Hibernate only validates it
    hibernate:
      ddl-auto: validate
    open-in-view: false
    show-sql: ${SPRING_JPA_SHOW_SQL:false}
  flyway:
    # Adopts databases created before Flyway (Sprint 1) as version 1
    baseline-on-migrate: true
  servlet:
    multipart:
      # Hard limit (413). Plate photos above 5 MB are rejected before this with a 400 field error
      max-file-size: 10MB
      max-request-size: 10MB

server:
  port: ${PORT:9200}
  servlet:
    context-path: /pk/api

app:
  jwt:
    secret: ${APP_JWT_SECRET}
    expiration: ${APP_JWT_EXPIRATION:24h}
  admin:
    name: ${APP_ADMIN_NAME:Administrador}
    email: ${APP_ADMIN_EMAIL:admin@parking.com}
    password: ${APP_ADMIN_PASSWORD}
  cors:
    allowed-origins: ${APP_CORS_ALLOWED_ORIGINS:http://localhost:4200,https://parking-frontend-eight.vercel.app}
  spaces:
    stream:
      # Real-time connections are renewed by the client after this time
      timeout: ${APP_SPACES_STREAM_TIMEOUT:30m}
  ocr:
    # Readings below this confidence are flagged for the operator to check
    confidence-threshold: ${APP_OCR_CONFIDENCE_THRESHOLD:0.80}
    timeout: ${APP_OCR_TIMEOUT:10s}
    plate-recognizer:
      url: ${APP_OCR_PLATE_RECOGNIZER_URL:https://api.platerecognizer.com/v1/plate-reader/}
      # Without a key every photo falls back to manual entry
      api-key: ${APP_OCR_PLATE_RECOGNIZER_API_KEY:}
      regions: ${APP_OCR_PLATE_RECOGNIZER_REGIONS:co}
